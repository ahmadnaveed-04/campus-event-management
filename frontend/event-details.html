<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details | Campus</title>
  <style>
    body {
      margin: 0;
      background: #f7f8f3;
      color: #17201c;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(760px, calc(100% - 36px));
      margin: 50px auto;
    }

    a { color: #22644a; }

    .card {
      padding: 28px;
      border: 1px solid #e5e9e1;
      border-radius: 20px;
      background: white;
    }

    .tag {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 20px;
      background: #eaf0e6;
      color: #22644a;
      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(32px, 6vw, 48px);
    }

    .muted {
      color: #717a74;
      line-height: 1.7;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 24px 0;
    }

    .detail {
      padding: 16px;
      border-radius: 12px;
      background: #f7f8f3;
    }

    .detail strong {
      display: block;
      margin-bottom: 6px;
    }

    .button {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 24px;
      background: #22644a;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 560px) {
      .details { grid-template-columns: 1fr; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">← Back to all events</a></p>

    <article class="card">
      <span class="tag">WORKSHOP</span>
      <h1>AI Workshop</h1>
      <p class="muted">
        Learn the basics of artificial intelligence, explore real examples,
        and take part in a friendly activity with other students.
      </p>

      <div class="details">
        <div class="detail">
          <strong>Date</strong>
          15 November 2026
        </div>
        <div class="detail">
          <strong>Time</strong>
          10:00 AM
        </div>
        <div class="detail">
          <strong>Location</strong>
          Lab 2
        </div>
        <div class="detail">
          <strong>Available seats</strong>
          40
        </div>
      </div>

      <a class="button" href="index.html#register">Register for this event</a>
    </article>
  </main>
</body>
</html>
